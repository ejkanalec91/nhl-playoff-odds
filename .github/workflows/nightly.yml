name: Nightly update

on:
  schedule:
    - cron: "0 11 * * *"   # 11:00 UTC = 7am Eastern (6am in winter), after every game has finished
  workflow_dispatch:         # "Run workflow" button on GitHub
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run model
        # One retry after a pause, in case the NHL API was briefly unavailable
        run: python -m model.run || (sleep 120 && python -m model.run)

      - name: Save updated data to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || git commit -m "Update odds $(date -u +%F)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
